name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install HDL tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends iverilog verilator

      - name: Run tests
        run: make lint test


